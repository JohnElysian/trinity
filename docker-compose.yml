name: trinity

services:
  server:
    build: .
    image: trinity-server
    container_name: trinity-server
    # Settings, accounts and bots are in trinity.yml; restart the server after
    # editing it. The data folder here wins over the file's, so the game's
    # data lives in the volume below.
    environment:
      RMR_CONFIG: /app/trinity.yml
      RMR_DATA: /app/data
      # A copy of the log on the host that outlives the container (it is
      # appended to), and the frames the server could not decode.
      RMR_LOG_FILE: /app/logs/server.log
      RMR_DUMP_DIR: /app/logs/dumps
    volumes:
      - ./trinity.yml:/app/trinity.yml:ro
      - ./logs:/app/logs
      # The live data: snapshots and the write-ahead log.
      - data:/app/data
    ports:
      - "26000:26000"
      # The web dashboard: this machine only, since it has no login.
      - "127.0.0.1:8080:8080"
    init: true
    # Time to save the data on the way down.
    stop_grace_period: 1m
    restart: unless-stopped

volumes:
  data:
